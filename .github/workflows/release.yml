name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # also dispatched by auto-tag on main (GITHUB_TOKEN tag pushes do not trigger workflows)

concurrency:
  group: release
  cancel-in-progress: false # queue releases; never run two publishes concurrently

permissions:
  contents: write      # create the GitHub release
  packages: write      # push to ghcr.io
  id-token: write      # keyless cosign + attestations
  attestations: write  # SLSA provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v4.3.0"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image digest
        id: image
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/yyewolf/a2a-discord-gtw:${GITHUB_REF_NAME#v}" --format '{{json .Manifest}}' | jq -r .digest)
          test -n "$digest" && test "$digest" != "null"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/yyewolf/a2a-discord-gtw
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish Helm chart
        id: chart
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          helm package charts/a2a-discord-gtw --version "$version" --app-version "$version" --destination "$RUNNER_TEMP/chart"
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          helm push "$RUNNER_TEMP/chart/a2a-discord-gtw-$version.tgz" oci://ghcr.io/yyewolf/charts 2>&1 | tee "$RUNNER_TEMP/chart/push.log"
          digest=$(awk '/^Digest:/ {print $2}' "$RUNNER_TEMP/chart/push.log")
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign Helm chart
        run: cosign sign --yes "ghcr.io/yyewolf/charts/a2a-discord-gtw@${DIGEST}"
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
